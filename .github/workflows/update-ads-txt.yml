name: Update ads.txt from Ezoic

# GitHub Pages has no support for path-based server redirects, so
# "Redirect 301 /ads.txt -> Ezoic's ads.txt manager" (the method Ezoic
# recommends) isn't possible here. This is the practical equivalent for a
# GitHub Pages site: pull the managed ads.txt on a schedule and commit it
# if it changed, so it stays in sync without needing a redirect or manual
# copy-pasting.

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC — adjust if Ezoic recommends a different cadence
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-ads-txt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch managed ads.txt from Ezoic
        run: |
          curl -fsSL "https://srv.adstxtmanager.com/19390/facturergratuit.com" -o ads.txt.new
          # Sanity check before overwriting: refuse anything that doesn't look
          # like a real ads.txt, so a transient upstream error can never wipe
          # out the live file.
          if [ ! -s ads.txt.new ] || ! grep -qiE '(direct|reseller)' ads.txt.new; then
            echo "::error::Fetched content doesn't look like a valid ads.txt — aborting without overwriting."
            cat ads.txt.new || true
            exit 1
          fi
          mv ads.txt.new ads.txt

      - name: Commit if changed
        run: |
          if git diff --quiet -- ads.txt; then
            echo "ads.txt unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ads.txt
          git commit -m "Auto-update ads.txt from Ezoic ads.txt manager"
          git push
